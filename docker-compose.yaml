# API Gateway for jACApp — all services, all databases and Redis in one compose.
# The gateway (8080) is the only entry point exposed to clients.
#
# Lives in the apiGateway repository: the gateway is the entry point of the whole
# system, so this file is the place where the full stack is assembled and started.
# authService and userService are built from the sibling repositories (../authService,
# ../userService) — jACApp and apiGateway must sit next to each other.
#
# Usage:
#   1. copy .env.example to .env and fill the values
#   2. docker compose up --build -d
#
# First start imports the Keycloak realm. To re-import after changing
# ../authService/realm/jacapp-realm.json: docker compose down -v && docker compose up --build -d

services:
  # --- Authentication Service DB (owned by Keycloak) ---
  keycloak-db:
    image: postgres:15-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloakdb}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD_is_required}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacapp-network

  # --- Authentication Service (Keycloak with custom SPI providers + realm import) ---
  keycloak:
    build: ../authService
    container_name: auth-service-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloakdb}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD_is_required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME_is_required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD_is_required}
      JC_CLIENT_SECRET: ${JC_CLIENT_SECRET:?JC_CLIENT_SECRET_is_required}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      # Admin console / direct access for debugging; clients should go through the gateway
      - "8180:8080"
      - "9000:9000"
    healthcheck:
      test: >-
        exec 3<>/dev/tcp/localhost/9000 &&
        echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
        cat <&3 | grep -q '200 OK'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - jacapp-network

  # --- User Service DB ---
  user-db:
    image: postgres:15-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-userdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-userdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacapp-network

  # --- Redis (User Service cache) ---
  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacapp-network

  # --- User Service (not exposed: reachable only via the gateway) ---
  user-app:
    build: ../userService
    container_name: user-service-app
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_HOST=user-db
      - POSTGRES_DB=${POSTGRES_DB:-userdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/jacapp/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_SECRET=${JC_CLIENT_SECRET:?JC_CLIENT_SECRET_is_required}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_is_required}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - jacapp-network

  # --- API Gateway (single entry point) ---
  api-gateway:
    build: .
    container_name: api-gateway
    depends_on:
      keycloak:
        condition: service_healthy
      user-app:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/jacapp/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_SECRET=${JC_CLIENT_SECRET:?JC_CLIENT_SECRET_is_required}
      - USER_SERVICE_URL=http://user-app:8081
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY_is_required}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - jacapp-network

networks:
  jacapp-network:
    name: jacapp-network
    driver: bridge

volumes:
  keycloak_db_data:
  user_db_data:
